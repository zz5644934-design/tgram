[project]
name = "tgram"
version = "0.1.0"
description = "Telegram CLI for Claude: read chats and send messages only on explicit user request"
requires-python = ">=3.10"
dependencies = ["telethon>=1.36"]

[project.scripts]
tg = "tgram.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tgram"]
